.log .p:first-child{border-top:0}.log .t{color:var(--mut);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem}.log .x{margin-top:5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86rem;white-space:pre-wrap;word-break:break-word}
.tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:4px;text-align:center;font-family:system-ui,sans-serif;font-weight:600}
.tag.ok{background:color-mix(in srgb,var(--on) 18%,transparent);color:var(--on)}
.tag.error{background:color-mix(in srgb,var(--error) 18%,transparent);color:var(--error)}
.tag.ui{background:color-mix(in srgb,var(--ui) 18%,transparent);color:var(--ui)}

/* Each piece switches where it actually stops fitting, so nothing is ever squashed.
   860: the side menu folds away - the content keeps its desktop shape on the freed width.
   700: a quarantine folder, whose two buttons need the most room.
   640: a list row needs ~560 px of card width; below that the code and the dropdown collide.
   420: the dropdown drops to a line of its own, which is the shape a phone gets.
   Last in the stylesheet on purpose, so it wins over the row template above without louder
   selectors. */
@media(max-width:640px){
 .listRow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;
   grid-template-areas:"chk name handle remove" ". code handle remove";
   column-gap:8px;row-gap:0;align-items:center}
 /* The checkbox sits on the name line only, so it lines up with the name rather than with the
    middle of the whole row. The two text lines are pulled close together. */
 .listRow>input[type="checkbox"]{grid-area:chk}
 .listRow b{grid-area:name;white-space:normal;line-height:1.2}
 .listRow small{grid-area:code;margin-left:0;min-width:0;line-height:1.25}
 .listRow .handle{display:none}   /* the arrows take its place */
 .listRow .mv{display:flex;grid-area:handle}
 .ondesk{display:none} .onphone{display:inline}   /* text that names the reorder control in use */
 .listRow .mv:has(+.remove){padding-right:10px;margin-right:8px;border-right:1px solid var(--rule)}   /* keeps a thumb on the arrows off the X */
 .prio:not(.ruleList) .listRow .remove{align-self:center;margin-top:0}   /* language lists: the X in the middle of the row, level with the arrows */
 .listRow .remove{grid-area:remove;align-self:start;margin-top:1px}   /* the X belongs to the name line, not to the middle of the row */
 .listRow.mer{display:flex}   /* the Add more row is one full-width select, not a grid */
 /* Language and codec rows: the dropdown sits on the top line beside the handle and the cross,
    and the arrow below it starts where the dropdown starts. */
 .ruleList .listRow,.cxList .cxRow{grid-template-columns:auto minmax(0,1fr) auto auto auto;
   grid-template-areas:"chk name sel handle remove" ". code cue handle remove"}
 /* Language rows read top-down: the arrow first, the dropdown it points at underneath. Same column,
    so their left edges line up. */
 .ruleList .listRow{grid-template-areas:"chk name cue handle remove" ". code sel handle remove"}
 /* A rule row has no checkbox, so it must not keep that column's width - otherwise the name sits
    8px further in than on a wider screen. */
 .ruleList .listRow:not(:has(>input[type="checkbox"])){grid-template-columns:minmax(0,1fr) auto auto auto;
   grid-template-areas:"name cue handle remove" "code sel handle remove"}
 .ruleList .listRow .selcue{grid-area:cue;justify-self:end;margin-left:0;align-self:start;margin-top:1px}
 .listRow .selcue .ar{display:none}
 .ruleList .listRow select.mode,.cxList .cxRow select.mode{grid-area:sel;width:8.5rem;max-width:100%;margin:0;justify-self:end}
 /* The subtitle rows hold language names too, so they get the same width as the custom list. */
 .ruleList.subList:not(.mapList) .listRow select.mode{width:8.5rem}
 /* A subtitle row in two columns: "Original audio is:" over the language on the left, "subtitle is" over its dropdown on the right. */
 .ruleList.subList .listRow.subRow{grid-template-columns:minmax(0,1fr) auto auto auto;grid-template-areas:"name cue handle remove" "name sel handle remove"}
 .ruleList.subList .listRow.subRow>b{align-self:start}
 .ruleList.subList .listRow.subRow .olab{display:block;color:var(--mut);font-size:.78rem;font-weight:400;margin-bottom:6px}
 .ruleList.subList .listRow.subRow .olab::after{content:":"}
 .ruleList.subList .listRow.subRow .selcue{justify-self:start;margin:0 0 4px}
 .cxList .cxRow select.mode{width:7rem}   /* Prefer/Avoid are short - leaves the codec name a whole line */
}
/* A quarantine folder in the narrow layout: the name on the left, how much is in it anchored
   top right, and the two buttons anchored bottom right. */
@media(max-width:700px){
 .bkRow.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;column-gap:8px;row-gap:10px;align-items:center}
 .bkRow.qrow .bkbutton{display:contents}
 .bkRow.qrow>code{grid-row:1;grid-column:1;justify-self:start}
 .bkRow.qrow .hint{grid-row:1;grid-column:2/-1;justify-self:end;text-align:right}
 .bkRow.qrow button[data-restore]{grid-row:2;grid-column:2}
 .bkRow.qrow button[data-clear]{grid-row:2;grid-column:3}
}
.uprof summary{cursor:pointer;list-style:none;padding:8px 0;color:var(--mut);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:12px}
.uprof summary::-webkit-details-marker{display:none}
.uprof summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .18s}
.uprof[open] summary::before{transform:rotate(45deg)}
.uprof summary:hover{color:var(--fg)}
.ubody.ulocked{opacity:.5;pointer-events:none;user-select:none}.ubody.ulocked section.fold>h2{pointer-events:auto}   /* a locked card can still be folded open and read */
.ulocknote{margin:2px 0 0}
.uname{white-space:nowrap}
.ulockbtn{margin-left:auto;font-size:.78rem;padding:3px 10px;flex:none}
#gprev{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;background:var(--bg)}   /* admin: guest preview */
.gprevbar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--acc);color:#fff;font-weight:600;font-size:.88rem}
.gprevbar span{margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gprevbar button{background:#fff;color:#14261b;border:0;flex:none}
.gprevbox{flex:1;display:flex;justify-content:center;min-height:0}
.gprevbox iframe{border:0;width:100%;height:100%;transition:max-width .25s ease}
#gprev.phone .gprevbox iframe{max-width:412px;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}

.demobtn{border-style:dashed;color:var(--acc);border-color:var(--acc)}   /* Users: demo mode, a tool rather than an account */
.ulockbtn.on{border-color:var(--acc);color:var(--acc)}

<script>
(function(){try{                       // one-time migration of the old Swedish localStorage keys
  const old={flaggarr_tema:'flaggarr_theme',flaggarr_undermeny:'flaggarr_submenu',flaggarr_torr:'flaggarr_dryrun',flaggarr_skrapkat:'flaggarr_trash_categories',flaggarr_valkommen:'flaggarr_welcome'};
  const cat={foraldralos:'orphaned',overflodig:'redundant',subsmapp:'subs_folder'};
  for(const g in old){const v=localStorage.getItem(g); if(v===null)continue;
    if(localStorage.getItem(old[g])===null)localStorage.setItem(old[g], g==='flaggarr_skrapkat'?v.replace(/foraldralos|overflodig|subsmapp/g,m=>cat[m]):v);

}catch(e){}})();

const $=s=>document.querySelector(s);
const _fetch=window.fetch; window.fetch=(u,o={})=>_fetch(u,{...o,headers:{"X-Requested-With":"flaggarr",...(o.headers||{})}}).then(r=>{if(r.status===401)location.reload(); return r});
let st=null, page="overview", logCategory="action", logFile="all", logKind="all", logSearch="", logPage=0, logPageKey="", conn=null, connflik="plex", connst={}, stats=null, users=null, ubaseline="";
const TYPES={ok:"ok",error:"error",skip:"skip",ui:"ui",start:"start",info:"info"};
const LOG_FILES={all:["All jobs",null],listener:["Listener",null],trash:["Remove trash files","action"],langs:["Remove unwanted subs","action"],weekly:["Set MKV flags","action"],plex:["Set Plex selections","action"],error:["Crashes (stderr)","system"]};
function timeUntil(t){const d=(new Date(t.replace(" ","T"))-Date.now())/1000; if(isNaN(d))return t; if(d<=0)return "due now"; if(d<3600)return "in "+Math.round(d/60)+" min"; if(d<172800)return "in "+Math.round(d/3600)+" h"; return "in "+Math.round(d/86400)+" days";}
function timeAgo(t){const d=(Date.now()-new Date(t.replace(" ","T")))/1000; if(isNaN(d))return t; if(d<60)return "just now";   /* a stamp a few seconds ahead of this computer's clock is still just now */ if(d<3600)return Math.round(d/60)+" min ago"; if(d<86400)return Math.round(d/3600)+" h ago"; const dd=Math.round(d/86400); if(d<86400*14)return dd+(dd===1?" day ago":" days ago"); const w=Math.round(dd/7); return w+(w===1?" week ago":" weeks ago")}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
/* The long explanations sit behind a small "?" beside the title - hover on a mouse, tap on a phone,

   so it can carry markup instead of being squeezed through an attribute. */
let QTXT=[];
function qm(desc){if(!desc)return "";QTXT.push(desc);return '<button type="button" class="qm" data-q="'+(QTXT.length-1)+'" aria-label="What this does">?</button>'}
function sw(k,title,desc){const m=title.match(/^(\d) · (.*)$/); if(m)title='<span class="num">'+m[1]+'</span>'+m[2];

function swCheck(k,title,desc){return '<label><input type="checkbox" data-k="'+k+'" '+(st.settings[k]?'checked':'')+'><span><b>'+title+qm(desc)+'</b></span></label>';}
function modal(title,html,foot){const m=document.createElement("div"); m.className="modalBack"; m.innerHTML='<div class="modal"><header><span>'+title+'</span><button type="button" data-close>&times;</button></header><div class="kropp">'+html+'</div>'+(foot?'<footer>'+foot+'</footer>':'')+'</div>';
  m.addEventListener("click",e=>{if(e.target===m||e.target.closest("[data-close]"))m.remove()}); document.body.appendChild(m); return m}
function confirmBox(title,html,buttonText,cb,cls){const m=modal(title,html,'<span></span><div style="display:flex;gap:10px"><button type="button" data-close>Cancel</button><button type="button" class="'+(cls===undefined?"danger":cls)+'" id="__confirm">'+buttonText+'</button></div>');
  m.querySelector("#__confirm").addEventListener("click",()=>{m.remove();cb()}); return m}
const ORIG="orig";
const FOLLOW="follow";   // reserved in sub_rules: the text follows the audio
const NEVER="never";   // reserved in sub_rules: no subtitle at all, whatever is spoken
const PLEX="skip";   // reserved in both fields: this set is not ours to write   // the language-list row that stands for the title's own language (track_rules.ORIGINAL)
function langName(v){if(v===ORIG)return "Title original language"; const l=st.languages.find(x=>x[0]===v||x[1]===v); return l?l[0][0].toUpperCase()+l[0].slice(1):v}
function undoBox(){

  if(s.running)return h+'<div class="last_run running"><span class="spinner"></span>putting the run from '+esc(s.run)+' back … '+(s.done||0)+' of '+(s.total||0)+'</div>';

}
function openRestore(){const list=(st&&st.backups)||[]; if(!list.length){modal("Restore a backup",'<p class="hint" style="margin:0">No backups yet.</p>'); return} const m=confirmBox("Restore a backup",'<p class="hint" style="margin:0 0 .7em">Pick a backup. Every setting is replaced by that copy, connections and sign-in included. A backup of the current settings is written first.</p><div class="bklist">'+list.map((f,i)=>'<label class="bkRow"><span class="bkpick"><input type="radio" name="bkpick" value="'+esc(f)+'"'+(i?'':' checked')+'><code>'+esc(f)+'</code></span><span class="bkbutton"><button type="button" class="bkclose" data-bkdel2="'+esc(f)+'" title="Delete this backup" aria-label="Delete this backup">&#10005;</button></span></label>').join("")+'</div>',"Restore",async()=>{const el=m.querySelector('input[name="bkpick"]:checked'); if(!el) return; const file=el.value; const r=await (await fetch("/api/restore",{method:"POST",body:JSON.stringify({file:file})})).json(); lastHtml=""; await load(); modal("Restore",r.ok?'<p class="hint" style="margin:0">Settings restored from <b>'+esc(file)+'</b>.</p>':'<p class="hint" style="margin:0">Could not restore that backup.</p>')}); m.addEventListener("click",ev=>{const db=ev.target.closest("[data-bkdel2]"); if(!db) return; ev.stopPropagation(); ev.preventDefault(); const file=db.dataset.bkdel2; confirmBox("Delete this backup?",'<p class="hint" style="margin:0"><b>'+esc(file)+'</b> is removed from config/backup. The settings in use are not touched.</p>',"Delete",async()=>{await fetch("/api/backup_delete",{method:"POST",body:JSON.stringify({file:file})}); lastHtml=""; await load(); m.remove(); openRestore()})})}
function listRow(v,code,on,free){return '<div class="listRow" draggable="false" data-v="'+esc(v)+'"><input type="checkbox" '+(on?'checked':'')+'><span class="n"></span><b>'+esc(langName(v))+'</b>'+(code?'<small>'+esc(v)+'</small>':'')+''+handleHtml()+'<button type="button" class="remove" title="Remove from list">&#10005;</button></div>'}
function langList(k,title,desc,show,free,solo){const code=st.code_fields.includes(k);
  const chosen=st.settings[k].split(" ").filter(Boolean);
  const all=st.languages.map(l=>code?l[1]:l[0]);
  const common=all.slice(0,show||COMMON).filter(v=>!hidden(k).includes(v));                                   // the common ones are always shown
  const used=k==='unwanted_langs'?['audio_priority','sub_langs','native_langs','same_sub_langs'].flatMap(f=>String(st.settings[f]||'').split(' ')).filter(v=>all.includes(v)&&!hidden(k).includes(v)):[];   // the languages you use elsewhere, as suggestions
  const kept=shown(k).concat(used).filter((v,i,a)=>all.includes(v)&&!chosen.includes(v)&&a.indexOf(v)===i);   // added by you, unticked

let qsStep=0; const qsPick={aud:'',sub:'',sdh:'',forced:''};
function qsCards(kind,list){
 return '<div class="choice2" data-qs="'+kind+'">'+list.map(o=>'<button type="button" class="chbox'+(qsPick[kind]===o[0]?' sel':'')+'" data-qsv="'+o[0]+'"><b>'+o[1]+'</b><small>'+o[2]+'</small></button>').join('')+'</div>'}
function qsSummary(){const langs=qsLangs().map(v=>esc(langName(v)));
 const rows=['Audio: '+(qsPick.aud==='orig'?'the original language first, then '+(langs.join(', ')||'\u2014'):(langs.join(', ')||'\u2014')+', then the original')];
 rows.push('Subtitles: '+(qsPick.sub==='never'?'never':'only when the audio is a language you do not understand, in '+(langs.join(', ')||'\u2014')));
 rows.push('Hearing-impaired (SDH): '+(qsPick.sdh==='allowed'?'may be used':'never used'));
 rows.push('Forced: '+(qsPick.forced==='last'?'used last, after a full track':'never used'));
 return '<div class="ruleBox"><b>This is what gets saved</b><ul>'+rows.map(r=>'<li>'+r+'</li>').join('')+'</ul></div>'}
function qsLangs(){const box=document.querySelector('#main .prio[data-k="audio_priority"]');
 return box?listValue(box).split(' ').filter(v=>v&&v!==ORIG&&v!==PLEX):[]}
function quickStartPage(){
 const parts=[
  '<p class="hint">Tick the languages you understand, favourite on top. Everything else counts as foreign.</p>'+langList('audio_priority','','',1),
  qsCards('aud',[['orig','Prefer original language','Play the language the title was made in. If it is missing, your languages are the fallback.'],
                 ['list','Prefer dubbed language','Play your selected language above. If no match exists, the original language is the fallback.']]),
  qsCards('sub',[['follow','Only when foreign language','No subtitles when you understand what is spoken.'],
                 ['never','Never','No subtitles at all.']]),
  qsCards('sdh',[['never','Skip hearing-impaired tracks','SDH tracks are never picked.'],
                 ['allowed','Allow hearing-impaired tracks','SDH may be picked when nothing else fits.']])
   +qsCards('forced',[['last','Forced tracks last','A full track wins; forced is used when there is nothing else.'],
                 ['never','Never use forced tracks','Forced tracks are never picked.']]),
  '<div class="qssum"></div>'];
 return '<h1>Quick start</h1><p class="sub">Four questions, then flaggarr is set up. You can change everything later under Languages and Tracks.</p>'
  +'<div class="qwiz"><div class="wizbar">'+QS_STEPS.map((w,i)=>'<button type="button" data-qstep="'+i+'"><span>'+(i+1)+'</span><em>'+w+'</em></button>').join('')+'</div>'
  +parts.map((p,i)=>'<div class="wstep" data-w="'+i+'"><h3>'+QS_Q[i]+'</h3>'+p+'</div>').join('')
  +'<div class="wiznav"><button type="button" data-qnav="-1">\u2190 Back</button><span class="wizhint" hidden>Pick one to continue</span>'
  +'<button type="button" data-qskip>Skip</button><button type="button" class="prim" data-qnav="1">Next \u2192</button></div></div>'}
function qsSync(){const w=document.querySelector('#main .qwiz'); if(!w)return;
 const steps=[...w.querySelectorAll('.wstep')], last=steps.length-1;
 const done=i=>i===0?qsLangs().length>0:(i===1?!!qsPick.aud:(i===2?!!qsPick.sub:(i===3?!!(qsPick.sdh&&qsPick.forced):true)));
 let reach=0; while(reach<last&&done(reach))reach++;
 qsStep=Math.max(0,Math.min(reach,qsStep));
 steps.forEach(x=>{x.hidden=+x.dataset.w!==qsStep});
 w.querySelectorAll('[data-qstep]').forEach(b=>{const i=+b.dataset.qstep; b.disabled=i>reach; b.classList.toggle('on',i===qsStep); b.classList.toggle('done',i<qsStep)});
 const sum=w.querySelector('.qssum'); if(sum&&qsStep===last)sum.innerHTML=qsSummary();
 w.querySelector('[data-qnav="-1"]').hidden=qsStep===0;
 const nx=w.querySelector('[data-qnav="1"]'); nx.textContent=qsStep===last?'Save':'Next \u2192';
 const ok=done(qsStep); nx.disabled=!ok&&qsStep!==last; w.querySelector('.wizhint').hidden=ok}
async function qsSave(){const langs=qsLangs(), l=langs.join(' ');
 const d={audio_priority:(qsPick.aud==='orig'?'orig '+l:l+' orig').trim(), audio_map:'',
   sub_rules:(qsPick.sub==='never'?NEVER:FOLLOW)+':none', sub_langs:l,
   sub_track_order:'text'+(qsPick.sdh==='allowed'?' sdh':'')+(qsPick.forced!=='never'?' forced':''), sub_forced_mode:'nofull', quickstart_done:true};   // the shape the guest questions save too - sub_sdh/sub_forced are derived from it on every save
 try{await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})}catch(e){}
 page='overview'; location.hash='#overview'; drawn=null; await load()}
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-qsv],[data-qstep],[data-qnav],[data-qskip]'); if(!t)return;
 if(t.dataset.qsv!==undefined){const kind=t.closest('[data-qs]').dataset.qs; qsPick[kind]=t.dataset.qsv;
   t.parentNode.querySelectorAll('.chbox').forEach(x=>x.classList.toggle('sel',x===t)); qsSync(); return}
 if(t.dataset.qstep!==undefined){qsStep=+t.dataset.qstep; qsSync(); return}
 if(t.hasAttribute('data-qskip')){fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({quickstart_done:true})}).then(()=>{page='overview'; location.hash='#overview'; drawn=null; load()}); return}
 const last=document.querySelectorAll('#main .qwiz .wstep').length-1;
 if(t.dataset.qnav==='1'&&qsStep===last){qsSave(); return}
 qsStep+= +t.dataset.qnav; qsSync()});
document.addEventListener('change',e=>{if(document.querySelector('#main .qwiz'))qsSync()});

  tracks:()=>'<h1>Tracks</h1><p class="sub">Which track is picked once the language is settled: by codec on the audio side, by type on the subtitle side.</p>'
   +'<section><h2>Codec rules'+mech()+'</h2><p class="hint">Some titles have several audio tracks in the same language. With no rules here, the one with the most speaker channels wins — that is how it has always worked. Add a rule to let the codec decide instead.</p><p class="hint"><b>Prefer</b> beats the channel count. <b>Avoid</b> loses to every other track in that language, but is still taken when it is the only one. A codec with no rule here is not treated specially.</p><p class="hint">The language order under <b>Your languages</b> on <a href="#languages">Languages</a> still comes first \u2014 a rule only decides between tracks in the same language. The list holds the audio codecs Plex plays. Names are matched loosely against the codec name with punctuation ignored, so <code>dts</code> covers every DTS flavour while <code>dtshd</code> covers only the lossless ones. When two rules match the same track, the one higher in the list wins. One catch: Plex calls every DTS flavour <code>dca</code>, so a <code>dtshd</code> rule only reaches the flags written into the files - on the Plex side use <code>dts</code>.</p>'

     try{await fetch("/api/logout",{method:"POST",body:"{}"})}catch(x){} location.reload()});}

function draw(){
  QTXT=[];                                                  // the ? texts belong to the html being drawn
  if(window.__demoStart==='thanks'){window.__demoStart=''; if(location.hash!=='#thanks'){goHash('#thanks'); return}}   // a srcdoc preview cannot replaceState, but a hash navigation works and redraws
  if(st&&st.me)page=(location.hash==="#thanks")?"thanks":"users";                       // a Plex-signed-in user has exactly one page
  else if(st&&st.settings&&st.settings.quickstart_done===false)page="quickstart";   // a brand-new install, and the demo
  if(page!=="statistics"){statsDrawn=false; statsAnimT=0}                 // the bars animate the next time you come in
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("active",a.dataset.s===page));
  drawSubmenu();
  logoutButton();
  {const kj=!!(st&&st.jobs&&Object.keys(st.jobs).some(k=>st.jobs[k].running)); const rl=document.querySelector('nav a[data-s="run"]'); if(rl){rl.classList.toggle("running",kj); rl.title=kj?"A job is running":"";}}
  {const ml=document.querySelector("nav a[data-s='media']"); if(ml&&st){const rs=st.roots_state||{}; const bad=!mountList().length||st.media_root_ok===false||Object.keys(rs).some(k=>!rs[k].inside||!rs[k].exists); let w=ml.querySelector('.warnIcon'); if(bad&&!w){w=document.createElement('span'); w.className='warnIcon'; w.textContent='\u26a0'; w.title='Media root is not reachable - see Media'; ml.appendChild(w)} else if(!bad&&w)w.remove()}}
  const el_=document.querySelector("nav a[data-s='log']"); if(el_){const ie=!!(st&&st.stat&&st.stat.open_issues); el_.classList.toggle("issue",ie); el_.title=ie?((st.stat.last_error||"")||"Errors in the log"):"";}
  const openSet=new Set([...document.querySelectorAll("details[open]")].map(d=>d.dataset.n));
  const active=document.activeElement;
  if(active&&active.dataset&&(active.dataset.k||active.dataset.cu||active.dataset.cp||active.dataset.ck)&&active.type!=="checkbox") return;
  if(active&&active.id==="statsQ") return;   // typing in the Statistics search   // don't overwrite while typing
  if(active&&active.type==="password"&&page==="security") return;
  if(document.querySelector("#main .prio")&&page==="media"&&drawn===page) return;   // keep unsaved priority lists
  if(active&&active.tagName==="SELECT"&&active.dataset.k) return;
  if(page==="connections"&&drawn==="connections"&&conn) return;   // keep unsaved fields; the page redraws itself on tab, test and save
  if(drawn!==page){HIDE=lsRead('flaggarr_hide_'); SHOW=lsRead('flaggarr_show_')}
  if(document.querySelector("#main .gqwiz")&&drawn===page&&lastHtml!==null) return;   // keep the guest's answers while the questions are open; a finish/back sets lastHtml=null first
  const _h=PAGES[page](); if(drawn===page&&_h===lastHtml)return;   // do not redraw when nothing changed (the glow went out)
  lastHtml=_h; $("#main").innerHTML=_h; drawn=page; if(page==="statistics")statsAnim();
  baseline=formValue(); ubaseline=uval(); checkDirty();
  document.querySelectorAll("#main .prio").forEach(listNumber); lockLast(); wizSync(); gqSync(); guestHead(); demoReport(); summarySync();
  openSet.forEach(n=>{const d=document.querySelector('details[data-n="'+n+'"]');if(d)d.open=true});
  document.querySelectorAll("pre").forEach(p=>{p.scrollTop=p.scrollHeight});
  $("#foot").innerHTML='<a href="#about" style="color:inherit;text-decoration:none">v'+st.version+'</a>'; $("#foot").title="listener time "+st.now;
  if(st&&(st.me?st.no_img:(st.settings&&st.settings.users_no_image_subs)))imgLock(true);
  viewSync();
  neverSync();
  qsSync();
  bazarrFresh();
  if(page==="overview"&&!welcomeShown){welcomeShown=true; let seen=false; try{seen=localStorage.getItem("flaggarr_welcome")==="1"}catch(e){} if(!seen)welcome()}
  if(page==="log")loadLog();
  if(page==="connections"&&!conn)loadConn();
  if((page==="statistics"||page==="general"||page==="cleanup")&&!stats)loadStats();
  if(page==="users"&&!users)loadUsers();
  if(page==="cleanup"||page==="languages")loadTags();
  foldHints();
}

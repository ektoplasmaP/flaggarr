# Builds the container image and publishes it to GitHub's registry, so a
# compose file can pull ghcr.io/ektoplasmap/flaggarr instead of building.
#
# Every push to main becomes :latest. A tag such as v0.87.0 also becomes
# :0.87.0. The version stamped into the image is read from app/ui.py, the one
# place it is written, so the label never disagrees with the page footer.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from app/ui.py
        id: v
        run: echo "version=$(sed -n 's/^VERSION *= *"\([^"]*\)".*/\1/p' app/ui.py)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: t
        run: |
          img=ghcr.io/${{ github.repository_owner }}/flaggarr
          img=$(echo "$img" | tr '[:upper:]' '[:lower:]')
          tags="$img:latest"
          case "$GITHUB_REF" in refs/tags/v*) tags="$tags,$img:${{ steps.v.outputs.version }}";; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.t.outputs.tags }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
